<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        #tg-layout { display: none; }
        .btn { padding: 15px 30px; background: #0088cc; color: white; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="tg-layout">
        <button class="btn" onclick="goToExternal()">Open in External Browser</button>
    </div>
    <script src="https://telegram.org"></script>

    <script>
        function checkApp() {
            const isTelegram = 
                window.TelegramWebviewProxy !== undefined || 
                window.TelegramWebview !== undefined ||
                (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform !== 'unknown');

            if (isTelegram) {
                document.getElementById('tg-layout').style.display = 'block';
                
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                }
            } else {
                window.location.replace("https://example.com");
            }
        }

        function goToExternal() {
            const url = 'https://example.com';
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                window.Telegram.WebApp.openLink(url);
            } else {
                window.location.href = url;
            }
        }

        window.onload = checkApp;
    </script>
</body>
</html>
